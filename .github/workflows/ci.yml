name: Tests, données et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Chaque jour à 05:00 UTC : récupère les CSV depuis Google Drive et republie le site.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      # Le test de parité navigateur est ignoré ici (playwright n'est pas installé) :
      # il tourne dans le job « parity ».
      - name: Lance les tests
        run: pytest tests/ -v

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dépendances (avec Playwright)
        run: pip install -r requirements-dev.txt

      - name: Installe Chromium
        run: playwright install --with-deps chromium

      - name: Compare les chiffres du navigateur à ceux de Python
        run: pytest tests/test_parity_browser.py -v

  deploy:
    needs: [test, parity]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      # Sans manifeste configuré (code 3), on utilise le dossier data/ du dépôt ; tout autre
      # échec (fichier non partagé, réseau) arrête la publication plutôt que de mettre en
      # ligne des données périmées sans le dire.
      # Les liens de partage Drive ne sont pas dans le dépôt : ils vivent dans le secret
      # DRIVE_SOURCES (Settings > Secrets and variables > Actions), au format « nom,lien »,
      # une ligne par fichier. Le dépôt peut donc être public sans donner accès aux CSV.
      # Sans ce secret, le pipeline utilise le dossier data/ du dépôt.
      - name: Écrit le manifeste depuis le secret DRIVE_SOURCES
        shell: bash
        env:
          DRIVE_SOURCES: ${{ secrets.DRIVE_SOURCES }}
        run: |
          if [ -z "$DRIVE_SOURCES" ]; then
            echo "Secret DRIVE_SOURCES absent : le dossier data/ du dépôt sera utilisé."
            exit 0
          fi
          echo "$DRIVE_SOURCES" > data_sources.local.csv
          liens=$(grep -c "drive.google.com" data_sources.local.csv || true)
          echo "Manifeste écrit depuis le secret : $liens lien(s)."

      - name: Récupère les CSV (Google Drive, sinon data/)
        id: source
        shell: bash
        run: |
          set +e
          python scripts/fetch_sources.py --out build/data
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "dir=build/data" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "dir=data" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Génère data.json et assemble le site
        run: |
          mkdir -p site
          cp -r docs/. site/
          python scripts/compute_metrics.py --source "${{ steps.source.outputs.dir }}" --out site/data.json

      # Publication sur Cloudflare Pages, par téléversement direct.
      #
      # Le nom du projet passe par un secret, et pas en clair : il détermine l'adresse
      # <projet>.pages.dev, qu'on ne veut pas voir déductible depuis ce dépôt public.
      # GitHub masque aussi les valeurs de secrets dans les journaux d'exécution.
      #
      # L'exemple officiel de Cloudflare passe aussi « gitHubToken » : cette option fait
      # créer un Deployment GitHub, donc l'URL du dashboard apparaîtrait sur le dépôt, qui
      # est public. Elle est volontairement omise — le déploiement fonctionne sans, sans
      # rien annoncer.
      #
      # « --branch » doit correspondre à la branche de production du projet Cloudflare
      # (Pages > Settings > Builds & deployments). Sinon la mise en ligne part sur une URL
      # d'aperçu et l'adresse principale ne bouge pas.
      - name: Publie le site sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

  editorial-drift:
    # Surveille les deux sources saisies à la main : les scores MyBestSim qui ne
    # correspondent plus à leur page publique, et les notes Trustpilot dont le relevé a trop
    # vieilli. Indépendant du déploiement.
    #
    # Leur classement est éditorial et bouge (Holafly : 67 -> 75 en cinq jours). Un échec par
    # nuit jusqu'à ce qu'un humain édite le fichier ferait du rouge permanent, donc :
    #   - un score qui change chez eux => pull request, job vert (le diff est le signal) ;
    #   - un cas qui demande un arbitrage => job en échec, rien n'est écrit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      # Les deux contrôles ci-dessous comparent les sources éditoriales au catalogue RÉEL,
      # pour repérer un fournisseur ajouté depuis le dernier commit de docs/data.json.
      # Les liens de partage Drive ne sont pas dans le dépôt : ils vivent dans le secret
      # DRIVE_SOURCES (Settings > Secrets and variables > Actions), au format « nom,lien »,
      # une ligne par fichier. Le dépôt peut donc être public sans donner accès aux CSV.
      # Sans ce secret, le pipeline utilise le dossier data/ du dépôt.
      - name: Écrit le manifeste depuis le secret DRIVE_SOURCES
        shell: bash
        env:
          DRIVE_SOURCES: ${{ secrets.DRIVE_SOURCES }}
        run: |
          if [ -z "$DRIVE_SOURCES" ]; then
            echo "Secret DRIVE_SOURCES absent : le dossier data/ du dépôt sera utilisé."
            exit 0
          fi
          echo "$DRIVE_SOURCES" > data_sources.local.csv
          liens=$(grep -c "drive.google.com" data_sources.local.csv || true)
          echo "Manifeste écrit depuis le secret : $liens lien(s)."

      - name: Régénère la liste des fournisseurs du catalogue
        id: catalogue
        shell: bash
        run: |
          set +e
          python scripts/fetch_sources.py --out build/data
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            dir=data
          elif [ "$code" -eq 0 ]; then
            dir=build/data
          else
            exit "$code"
          fi
          python scripts/compute_metrics.py --source "$dir" --out build/data.json

      # Codes de sortie de check_editorial.py : 0 rien à faire, 3 valeurs recopiées dans
      # editorial_sources.py (une PR suit), 1 page illisible ou arbitrage humain (échec).
      # docs/data.json est régénéré depuis data/ (et non depuis le Drive) pour que la PR ne
      # contienne que l'effet du score, sans y mêler un changement de catalogue.
      - name: Compare les scores stockés à la page MyBestSim
        id: derive
        shell: bash
        run: |
          set +e
          python scripts/check_editorial.py --catalog build/data.json > rapport.txt
          code=$?
          set -e
          cat rapport.txt
          cat rapport.txt >> "$GITHUB_STEP_SUMMARY"
          rm -f rapport.txt
          if [ "$code" -ne 3 ]; then
            exit "$code"
          fi
          python scripts/check_editorial.py --catalog build/data.json --apply
          python scripts/compute_metrics.py --source data --out docs/data.json
          echo "derive=1" >> "$GITHUB_OUTPUT"

      # Branche réservée à ce job : elle est réécrite à chaque dérive, ce qui met à jour la
      # pull request ouverte au lieu d'en empiler une par nuit. Une PR poussée avec
      # GITHUB_TOKEN ne redéclenche pas les workflows : les tests tourneront à la fusion.
      - name: Ouvre la pull request de mise à jour
        if: steps.derive.outputs.derive == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branche=derive-scores-mybestsim
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branche"
          git add scripts/editorial_sources.py docs/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement à proposer."
            exit 0
          fi
          git commit -m "Aligne les scores MyBestSim sur leur page publique"
          git push --force origin "$branche"
          ouverte=$(gh pr list --head "$branche" --state open --json number --jq '.[].number')
          if [ -n "$ouverte" ]; then
            echo "Pull request #$ouverte mise à jour."
            exit 0
          fi
          gh pr create --base main --head "$branche"             --title "Aligne les scores MyBestSim sur leur page publique"             --body "Leur page publique ne donne plus les mêmes scores que scripts/editorial_sources.py. Les valeurs et la date de relevé ont été recopiées, et docs/data.json régénéré. Le résumé du run dit quel score a changé. À vérifier sur https://mybestsim.com/en/best-esim-providers/ avant de fusionner."

      # Trustpilot ne peut pas être interrogé (robots.txt : Disallow: / ; pages en 403), donc
      # la seule chose automatisable est l'âge du relevé manuel. « always() » pour que le
      # verdict Trustpilot sorte même quand le contrôle MyBestSim ci-dessus a déjà échoué.
      - name: Vérifie l'âge des notes Trustpilot relevées à la main
        if: always()
        shell: bash
        run: |
          python scripts/check_freshness.py --catalog build/data.json | tee -a "$GITHUB_STEP_SUMMARY"
